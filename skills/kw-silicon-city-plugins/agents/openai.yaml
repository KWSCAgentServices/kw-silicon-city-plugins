interface:
  display_name: "KW Silicon City Marketing Assistant"
  short_description: "Create branded real estate marketing materials"
  icon_small: "./assets/kwsc-realtrends-logo-color.png"
  icon_large: "./assets/kwsc-realtrends-logo-color.png"
  brand_color: "#CE011F"
  default_prompt: "Use $kw-silicon-city-plugins to collect and verify the listing facts, original listing photos, agent data, original Drive headshot, logo, attribution, and copy, then send the complete source packet to GPT Image to generate the entire polished design. When I request a full marketing campaign, create the coordinated six-piece core package plus any add-ons I name. Lead each piece with a verified attention headline, keep the body short with 3–5 scannable bullets and a calm CTA, make the property photos the visual hero, and keep the agent block smaller and secondary. Put Approx. directly with every square-foot measurement. Complete every authorized roster, Drive, listing-photo, and current price/status verification step before asking me. Do not return a prerequisite checklist while the available tools and sources can finish the work. If a genuine blocker remains after those steps, ask once with the minimum needed input. Make all corrections through GPT Image only—never with HTML, code, or post-generation compositing."
