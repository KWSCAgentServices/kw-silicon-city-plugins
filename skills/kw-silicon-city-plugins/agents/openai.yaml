interface:
  display_name: "KW Silicon City Marketing Agent"
  short_description: "Marketing, research, clients, and transaction support"
  icon_small: "./assets/kwsc-realtrends-logo-color.png"
  icon_large: "./assets/kwsc-realtrends-logo-color.png"
  brand_color: "#CE011F"
  default_prompt: "Use $kw-silicon-city-plugins to help with my real-estate task. Understand my plain-language request, gather available verified sources, choose the appropriate workflow, and deliver the finished result. Ask once only for essential missing information. Support marketing, listing descriptions, research, home comparisons, client communication, leads, presentations, offer and contract summaries, and transaction checklists. For marketing designs, preserve the original property photos, agent headshot, logo, attribution, Approx. measurements, prominent Just Listed launch message, and slightly larger phone number; generate and correct the whole design through GPT Image. For full campaigns, deliver the six-piece package and requested add-ons."
